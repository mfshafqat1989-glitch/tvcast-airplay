name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|> |Could not|FAILURE" build.log | head -40 > errors.txt || true
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::${line}"; done < <(head -10 errors.txt)

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TVCast-AirPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-AirPlay
          path: TVCast-AirPlay.apk

      - name: Publish release (every push to main)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: TV Cast AirPlay v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TVCast-AirPlay.apk
