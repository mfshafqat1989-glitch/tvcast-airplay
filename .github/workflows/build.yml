name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Cache OpenSSL for Android
        id: ossl
        uses: actions/cache@v4
        with:
          path: openssl-android
          key: openssl-android-3.0.15-api24-v1-${{ hashFiles('scripts/build-openssl.sh') }}

      - name: Build OpenSSL for Android
        if: steps.ossl.outputs.cache-hit != 'true'
        run: bash scripts/build-openssl.sh

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          touch build.log
          grep -E "^e: |error:|error: |What went wrong|^> |Could not|FAILURE|undefined reference|fatal error" build.log | head -60 > errors.txt || true
          echo "## Build errors" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat errors.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::error::${line}"; done < <(head -15 errors.txt)

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk TVCast-AirPlay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVCast-AirPlay
          path: TVCast-AirPlay.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: TV Cast AirPlay v2.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: TVCast-AirPlay.apk
